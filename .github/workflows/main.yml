name: Build Resume

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Install system dependencies
        run: sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libharfbuzz0b libgdk-pixbuf-2.0-0 fontconfig

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build artifacts
        run: python main.py
        env:
          OUTPUT_MD: readme.md
          OUTPUT_HTML: resume.html
          OUTPUT_PDF: resume.pdf
          OUTPUT_DOCX: resume.docx

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: resume
          path: |
            readme.md
            resume.html
            resume.pdf
            resume.docx

      - name: Update readme
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add readme.md
          git diff --staged --quiet || git commit -m "Update readme [skip ci]"
          git push

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            readme.md
            resume.html
            resume.pdf
            resume.docx
